<title>fukicycle design — 見本</title>
<!-- 3つの色の昼・夜で、同じ質感に見えるかを確かめるページ。
     tokens.json や material.css を直したら、ブラウザで開いて崩れていないか見る。
     色はここで仮に決めたもので、デザインシステムの色ではない。 -->
<link rel="stylesheet" href="../css/tokens.css" />

<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #7d8580; font-family: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
  .tile { position: relative; display: flex; flex-direction: column; gap: 20px; padding: 20px; border-radius: 28px; overflow: hidden; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .bar-in { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 18px; }
  .tray { height: 170px; display: flex; justify-content: center; gap: 14px; padding-top: 20px; border-radius: var(--fk-radius-plate); overflow: hidden; }
  .screen { width: 96px; height: 190px; border-radius: 16px; background: linear-gradient(160deg, #f4b740, #e84d7a 55%, #4c7de0); }
  .screen.two { margin-top: 30px; background: linear-gradient(200deg, #fff 0 30%, #3d8f6e 30% 60%, #203040 60%); }
  .cap { position: absolute; left: 36px; top: 206px; width: 230px; }
  .cap-in { display: flex; flex-direction: column; padding: 14px 18px; font-size: 13px; }
  .cap-in b { font-size: 16px; }
  .plate { margin-top: 40px; display: flex; justify-content: space-between; align-items: baseline; padding: 16px 22px; border-radius: 20px; }
  .plate b { font-size: 28px; }
</style>
