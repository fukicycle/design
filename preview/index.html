<title>fukicycle design — 見本</title>
<!-- 3つの色の昼・夜で、同じ質感に見えるかを確かめるページ。
     tokens.json や material.css を直したら、ブラウザで開いて崩れていないか見る。
     色はここで仮に決めたもので、デザインシステムの色ではない。 -->
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/material.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #7d8580; font-family: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }
  .tile { position: relative; display: flex; flex-direction: column; gap: 20px; padding: 20px; border-radius: 28px; overflow: hidden; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .bar-in { display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 4px 0 4px 4px; }
  .bar::after { content: ""; display: block; height: 2px; margin-top: 4px; background: linear-gradient(var(--fk-shade), var(--fk-shade)) top / 100% 1px no-repeat, linear-gradient(var(--fk-light), var(--fk-light)) bottom / 100% 1px no-repeat; }
  .tray { height: 170px; display: flex; justify-content: center; gap: 14px; padding-top: 20px; border-radius: var(--fk-radius-plate); overflow: hidden; }
  .screen { width: 96px; height: 190px; border-radius: 16px; background: linear-gradient(160deg, #f4b740, #e84d7a 55%, #4c7de0); }
  .screen.two { margin-top: 30px; background: linear-gradient(200deg, #fff 0 30%, #3d8f6e 30% 60%, #203040 60%); }
  .cap { position: absolute; left: 36px; top: 206px; width: 230px; }
  .cap-in { display: flex; flex-direction: column; padding: 14px 18px; font-size: 13px; }
  .cap-in b { font-size: 16px; }
  .plate { margin-top: 40px; display: flex; justify-content: space-between; align-items: baseline; padding: 16px 22px; border-radius: 20px; }
  .plate b { font-size: 28px; }
</style>
</head>

      <div class="fk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-label="進み具合" style="--fk-value: 0.4"><span class="fk-progress-fill"></span></div>
      <div class="fk-progress fk-progress--indeterminate" role="progressbar" aria-label="読み込み中"><span class="fk-progress-fill"></span></div>
    </section>
    <section class="tile fk-ground" data-theme="dark" style="--fk-ground-1:#170C16;--fk-ground-2:#3B1E34;--fk-ink:#F8EEF3;--fk-accent:#F2A6C6;--fk-on-accent:#2A0F1E" aria-label="パステル・夜">
      <header class="bar"><div class="bar-in">
        <b>パステル・夜</b>
        <span class="row"><button class="fk-icon-button" aria-label="通知"><svg class="fk-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5V4.5"/><path d="M5.5 14v-3a6.5 6.5 0 0 1 13 0v3z"/><path d="M12 14v2.5"/><path d="M10.5 16.5h3v5h-3z"/></svg></button></span>
      </div></header>
      <div class="tray fk-down"><div class="screen fk-up-s"></div><div class="screen two fk-up-s"></div></div>
      <div class="cap fk-glass fk-glass--legible"><div class="fk-glass-bd"></div><div class="fk-glass-in cap-in"><b>浮いている札</b><span>下の画面が透けて見えます。</span></div></div>
      <div class="plate fk-up"><span>浮いた板</span><b>12</b></div>
      <hr class="fk-groove" />
      <input class="fk-input" value="入力欄（沈む）" aria-label="入力欄" />
      <div class="row">
        <button class="fk-button fk-button--primary">保存する</button>
        <button class="fk-button"><svg class="fk-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M8 8l4-4 4 4"/><path d="M6 12v7.5h12V12"/></svg>共有</button>
        <button class="fk-icon-button" aria-label="ホーム"><svg class="fk-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.2v10.3h12V9.2"/><path d="M10 19.5v-5h4v5"/></svg></button>
        <button class="fk-icon-button" aria-label="ホーム（選択中）" aria-pressed="true"><svg class="fk-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g class="glass" opacity=".3" transform="translate(1.5 1.5)" style="color:var(--fk-icon-glass,currentColor)"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.2v10.3h12V9.2"/><path d="M10 19.5v-5h4v5"/></g><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.2v10.3h12V9.2"/><path d="M10 19.5v-5h4v5"/></svg></button>
      </div>
      <div class="row">
        <button type="button" class="fk-switch" role="switch" aria-checked="true" aria-label="通知を受け取る"></button>
        <button type="button" class="fk-switch" role="switch" aria-checked="false" aria-label="効果音"></button>
        <div class="fk-ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" aria-label="今日の達成" style="--fk-value: 0.72"><span class="fk-ring-label">72%</span></div>
        <div class="fk-ring fk-ring--sm" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35" aria-label="読み込み" style="--fk-value: 0.35"></div>
      </div>
      <div class="fk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-label="進み具合" style="--fk-value: 0.4"><span class="fk-progress-fill"></span></div>
      <div class="fk-progress fk-progress--indeterminate" role="progressbar" aria-label="読み込み中"><span class="fk-progress-fill"></span></div>
    </section>
<script>
  // スイッチは押すと切り替わる。円とバーは押すと値が変わる（動きの確認用）
  document.querySelectorAll(".fk-switch").forEach((b) =>
    b.addEventListener("click", () => b.setAttribute("aria-checked", String(b.getAttribute("aria-checked") !== "true"))));
  document.querySelectorAll(".fk-ring, .fk-progress:not(.fk-progress--indeterminate)").forEach((el) =>
    el.addEventListener("click", () => {
      const v = Math.round(Math.random() * 100);
      el.style.setProperty("--fk-value", v / 100);
      el.setAttribute("aria-valuenow", v);
      const label = el.querySelector(".fk-ring-label");
      if (label) label.textContent = v + "%";
    }));
</script>
</body>
</html>
